version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. RAGFlow Core Service (API + Web Frontend + Admin + Background Ingestor)
  # ─────────────────────────────────────────────────────────────────────────────
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v1.0.0-rc2}
    container_name: ${CONTAINER_PREFIX:-ragflow}-server
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    command:
      - --enable-adminserver
      - --init-superuser
    ports:
      - "${RAGFLOW_WEB_PORT:-80}:80"         # Cổng Web UI (Frontend)
      - "${RAGFLOW_HTTPS_PORT:-443}:443"     # Cổng Web HTTPS
      - "${RAGFLOW_API_PORT:-9380}:9380"     # Cổng REST API & MCP Server
      - "${RAGFLOW_ADMIN_PORT:-9381}:9381"   # Cổng Admin Management API
    environment:
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
      - DOC_ENGINE=elasticsearch
      - DB_TYPE=mysql
      - METADATA_DB_PROFILE=mysql
      - DEVICE=cpu
      
      # Kết nối MySQL nội bộ
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=${MYSQL_DBNAME:-rag_flow}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-infini_rag_flow}
      
      # Kết nối Elasticsearch nội bộ
      - ES_HOST=es01
      - ES_PORT=9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-infini_rag_flow}
      
      # Kết nối MinIO nội bộ
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_USER:-rag_flow}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-infini_rag_flow}
      
      # Kết nối Kvrocks (Redis protocol) nội bộ
      - KVROCKS_HOST=kvrocks
      - KVROCKS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-infini_rag_flow}
      
      # Kết nối NATS nội bộ
      - NATS_HOST=nats
      - NATS_PORT=4222
      
      # Tham số chạy hệ thống & Tài khoản Quản trị
      - SVR_WEB_HTTP_PORT=80
      - SVR_WEB_HTTPS_PORT=443
      - SVR_HTTP_PORT=9380
      - ADMIN_SVR_HTTP_PORT=9381
      - SVR_MCP_PORT=9382
      - DEFAULT_SUPERUSER_EMAIL=${DEFAULT_SUPERUSER_EMAIL:-admin@demego.vn}
      - DEFAULT_SUPERUSER_PASSWORD=${DEFAULT_SUPERUSER_PASSWORD:-ThanNong@09102021}
      - DEFAULT_SUPERUSER_NICKNAME=${DEFAULT_SUPERUSER_NICKNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${DEFAULT_SUPERUSER_PASSWORD:-ThanNong@09102021}
      - ALLOW_ANY_HOST=1
      - REGISTER_ENABLED=${ENABLE_REGISTER:-0}
      - ENABLE_REGISTER=${ENABLE_REGISTER:-0}
      - DISABLE_PASSWORD_LOGIN=false
      - THREAD_POOL_MAX_WORKERS=128
      - DOC_BULK_SIZE=4
      - EMBEDDING_BATCH_SIZE=16
    volumes:
      - ragflow_logs:/ragflow/logs
    networks:
      - ragflow_net
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      minio:
        condition: service_healthy
      kvrocks:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. MySQL Metadata Database
  # ─────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.40
    container_name: ${CONTAINER_PREFIX:-ragflow}-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-infini_rag_flow}
      - MYSQL_DATABASE=${MYSQL_DBNAME:-rag_flow}
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --binlog_expire_logs_seconds=604800
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-buffer-pool-size=1G
      - --innodb-redo-log-capacity=1G
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"    # Cổng kết nối DB từ ngoài máy chủ (quản trị)
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ragflow_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD:-infini_rag_flow}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Elasticsearch Document Engine
  # ─────────────────────────────────────────────────────────────────────────────
  es01:
    image: elasticsearch:8.11.3
    container_name: ${CONTAINER_PREFIX:-ragflow}-es01
    restart: unless-stopped
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-infini_rag_flow}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - "ES_JAVA_OPTS=-Xms${ES_JVM_HEAP:-2g} -Xmx${ES_JVM_HEAP:-2g}"
    tmpfs:
      - /tmp:mode=1777,size=512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${ES_EXPOSE_PORT:-9200}:9200"       # Cổng Elasticsearch REST API
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - ragflow_net
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD:-infini_rag_flow} -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. MinIO Object Storage
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: ${CONTAINER_PREFIX:-ragflow}-minio
    restart: unless-stopped
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-rag_flow}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-infini_rag_flow}
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API endpoint
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # MinIO Web Console dashboard
    volumes:
      - minio_data:/data
    networks:
      - ragflow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Apache Kvrocks (In-memory & Disk Key-Value store thay Redis)
  # ─────────────────────────────────────────────────────────────────────────────
  kvrocks:
    image: apache/kvrocks:2.16.0
    container_name: ${CONTAINER_PREFIX:-ragflow}-kvrocks
    restart: unless-stopped
    user: "0:0"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-infini_rag_flow}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/kvrocks
        echo "bind 0.0.0.0" > /var/lib/kvrocks/kvrocks.conf
        echo "port 6379" >> /var/lib/kvrocks/kvrocks.conf
        echo "dir /var/lib/kvrocks" >> /var/lib/kvrocks/kvrocks.conf
        printf "requirepass %s\n" "$$REDIS_PASSWORD" >> /var/lib/kvrocks/kvrocks.conf
        exec kvrocks -c /var/lib/kvrocks/kvrocks.conf --dir /var/lib/kvrocks
    ports:
      - "${KVROCKS_EXPOSE_PORT:-6379}:6379"  # Cổng Redis-compatible nếu cần kết nối từ ngoài
    volumes:
      - kvrocks_data:/var/lib/kvrocks
    networks:
      - ragflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-infini_rag_flow}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. NATS JetStream Message Broker
  # ─────────────────────────────────────────────────────────────────────────────
  nats:
    image: nats:2.14.2
    container_name: ${CONTAINER_PREFIX:-ragflow}-nats
    restart: unless-stopped
    command: -js -sd /data --http_port 8222
    ports:
      - "${NATS_EXPOSE_PORT:-4222}:4222"     # Cổng NATS client
      - "${NATS_MONITOR_PORT:-8222}:8222"   # Cổng NATS HTTP monitoring
    volumes:
      - nats_data:/data
    networks:
      - ragflow_net
    healthcheck:
      test: ["CMD", "nats-server", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

# ─────────────────────────────────────────────────────────────────────────────
# Persistent Volumes (Dữ liệu lưu trữ bền vững trên Docker Host)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: ${VOLUME_PREFIX:-ragflow}_mysql_data
  es_data:
    name: ${VOLUME_PREFIX:-ragflow}_es_data
  minio_data:
    name: ${VOLUME_PREFIX:-ragflow}_minio_data
  kvrocks_data:
    name: ${VOLUME_PREFIX:-ragflow}_kvrocks_data
  nats_data:
    name: ${VOLUME_PREFIX:-ragflow}_nats_data
  ragflow_logs:
    name: ${VOLUME_PREFIX:-ragflow}_logs

# ─────────────────────────────────────────────────────────────────────────────
# Internal Network
# ─────────────────────────────────────────────────────────────────────────────
networks:
  ragflow_net:
    name: ${NETWORK_NAME:-ragflow_net}
    driver: bridge
